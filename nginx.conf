# Ingress nginx for Speaches.
#
# The application (uvicorn/FastAPI) binds quickly even with an empty
# model cache (ADR 0003; measured 2.4s to a first HTTP 200 on /health).
# nginx is not here to bridge a slow bind, unlike the vLLM package this
# was cribbed from. It earns its place for other reasons: a request body
# size limit for audio uploads, buffering disabled in both directions so
# streamed transcription and streamed speech flow immediately, websocket
# support for /v1/realtime and Gradio's own transports, and a static
# /healthz that stays honest during the one genuinely slow window this
# package has: PRELOAD_MODELS downloads before the application's own
# port binds and the process exits if any download fails (ADR 0004), so
# a fresh install or clone needs a health answer that does not depend on
# that download finishing.
#
# The application runs as the container's main process (exec gosu, in
# start.sh); nginx is a background child that dies with the container,
# so this static /healthz can bridge the download window but can never
# mask an application crash.
#
# All writable paths are under /run/nginx (tmpfs): the root filesystem
# is read only at runtime.
#
# No API key logic anywhere in this file: the application enforces its
# own key on /v1/* and /api/* (docs/decisions/0005-auth-topology.md).
# nginx proxies every request through unconditionally.

worker_processes 1;
daemon off;
pid /run/nginx/nginx.pid;
# The "stderr" keyword, not the "/dev/stderr" path: as the unprivileged
# cloudron user, opening the /dev/stderr path fails EACCES and nginx
# then silently never binds.
error_log stderr warn;

events { worker_connections 1024; }

http {
  access_log off;

  # Websocket upgrade pair for the catch-all location below: /v1/realtime
  # is a websocket endpoint and Gradio uses long-lived connections too.
  # $connection_upgrade resolves to "upgrade" when the client asked for
  # one, "close" otherwise. map must live at http level, not server.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  client_body_temp_path /run/nginx/body;
  proxy_temp_path       /run/nginx/proxy;
  fastcgi_temp_path     /run/nginx/fastcgi;
  uwsgi_temp_path       /run/nginx/uwsgi;
  scgi_temp_path        /run/nginx/scgi;

  # Audio uploads are the payload here (multipart/form-data files, not
  # JSON). 256m covers roughly two hours of 44.1 kHz 16-bit stereo wav,
  # the honest worst common case. The platform's own proxy in front of
  # this container may impose a lower limit of its own; that ceiling is
  # not ours to set.
  client_max_body_size 256m;

  server {
    # Must match PUBLIC_PORT in start.sh and httpPort in
    # CloudronManifest.json; this file is static and not templated at
    # boot.
    listen 8000;
    server_name _;

    # Platform liveness (manifest healthCheckPath). Always answers, even
    # while the preload models are still downloading, and never touches
    # the backend so a slow or crashed application cannot take it down.
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    # Readiness passthrough to the application's own /health, kept
    # separate from /healthz so genuine readiness is observable without
    # risking the platform's restart-loop signal. Short timeouts: this
    # is a local loopback call, not a client-facing one.
    location = /ready {
      proxy_pass http://127.0.0.1:8001/health;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }

    # Everything else: the OpenAI-compatible API, the Gradio playground
    # UI, and the realtime console. Must match APP_PORT in start.sh.
    location / {
      proxy_pass http://127.0.0.1:8001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Websocket upgrade: /v1/realtime, and any Gradio transport that
      # opens one.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Both directions unbuffered so streamed transcription and
      # streamed speech are delivered as they are produced, not batched.
      proxy_buffering off;
      proxy_request_buffering off;

      proxy_connect_timeout 5s;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }
  }
}
